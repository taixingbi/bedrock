AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MVP Bedrock inference API via Lambda Function URL

Parameters:
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Default Bedrock model ID / imported-model ARN when request omits model
  ModelMap:
    Type: String
    Default: ""
    Description: Optional JSON object of request model alias → Bedrock model ID/ARN
  ApiKey:
    Type: String
    NoEcho: true
    Description: Shared secret required in Authorization Bearer or x-api-key header

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - x86_64

Resources:
  InferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bedrock-inference-mvp
      CodeUri: src/
      Handler: run.sh
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:28
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MODEL_MAP: !Ref ModelMap
          API_KEY: !Ref ApiKey
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_PORT: "8080"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:Converse
                - bedrock:ConverseStream
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "*"
          AllowHeaders:
            - content-type
            - x-api-key
            - authorization
          AllowMethods:
            - POST
          MaxAge: 86400
    Metadata:
      BuildMethod: makefile

Outputs:
  InferenceFunctionUrl:
    Description: Lambda Function URL for the inference API
    Value: !GetAtt InferenceFunctionUrl.FunctionUrl
  InferenceFunctionArn:
    Description: Inference Lambda ARN
    Value: !GetAtt InferenceFunction.Arn
