name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        run: sam build

      - name: Check required secrets
        env:
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::Missing repository secret AWS_ACCESS_KEY_ID"
            missing=1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing repository secret AWS_SECRET_ACCESS_KEY"
            missing=1
          fi
          if [ -z "$API_KEY" ]; then
            echo "::error::Missing repository secret INFERENCE_API_KEY. Add it under Settings → Secrets and variables → Actions → Repository secrets (name must match exactly)."
            missing=1
          fi
          exit "$missing"

      - name: Deploy
        env:
          MODEL_ID: ${{ vars.MODEL_ID }}
          API_KEY: ${{ secrets.INFERENCE_API_KEY }}
        run: |
          MODEL_ID="${MODEL_ID:-amazon.nova-lite-v1:0}"
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name bedrock-inference-mvp \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "ModelId=${MODEL_ID}" \
              "ApiKey=${API_KEY}"
